<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="styleSheet">
    <title>タスク追加</title>
</head>
<body>
<div class="header-contents">
    <h2>タスク追加</h2>
</div>
<div class="main-contents">
    <form method="post" action="/add" th:object="${formModel}">
        <div class="form-area">
            <div class="errorMessages">
                <tr th:if="${errorMessages}" th:each = "errorMessage : ${errorMessages}">
                    <td th:text="${errorMessage}"></td><br>
                </tr>
            </div>
            <table class="table table-borderless">
                <thead>
                <tr>
                    <th scope="col" style="width: 70%">内容</th>
                    <th scope="col" style="width: 30%">期限</th>
                </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <textarea class="tweet-box" th:field="*{content}" size="20" maxlength="200" /></textarea><br/>
                        </td>
                        <td>
                            <input type="date" name="limitDate" th:value="*{limitDate}">
                        </td>
                    </tr>
                </tbody>
            </table>
            <input type="submit" value="追加" />
        </div>
    </form>
</div>
<div class="footer-contents">
    <form action="/">
        <input type="submit" value="戻る" />
    </form>
</div>
</body>
</html>
