<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link th:href="@{/css/style.css}" rel="styleSheet">
    <script src="//code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="../js/main.js"></script>
    <title>TOP</title>
</head>
<body>
<div class="header-contents">
    <h1>To Do List</h1>
</div>
<div class="errorMessages">
        <td th:text="${errorMessage}"></td>
    </tr>
</div>
<div class="main-contents">
    <div class="message-icon">
        <form th:action="@{./}" method="get">
            <table class="table table-borderless">
                <thead>
                    <tr>
                        <th scope="col" style="width: 10%">絞込</th>
                        <th scope="col" style="width: 40%">キーワード</th>
                        <th scope="col" style="width: 50%">期限</th>
                    </tr>
                </thead>
                <tbody>
                <tr>
                    <td>
                        <select class="search" id="strStatus" name="strStatus" th:value="${strStatus}">
                            <option value="">ステータス</option>
                            <option value="1" th:selected="${strStatus == '1'}">未実施</option>
                            <option value="2" th:selected="${strStatus == '2'}">実行中</option>
                            <option value="3" th:selected="${strStatus == '3'}">ステイ中</option>
                            <option value="4" th:selected="${strStatus == '4'}">完了</option>
                        </select>
                    </td>
                    <td><textarea class="tweet-box" name="keyword" th:text="${keyword}" placeholder="タスク内容のキーワード" size="20" maxlength="200" /></textarea></td>
                    <td>
                        <input class="search" type="date" name="strStartDate" th:value="${strStartDate}"> ～ <input class="search" type="date" name="strEndDate" th:value="${strEndDate}">
                        <input class="search" type="submit" value="絞込">
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>

<div class="main-contents">
    <a href="/new">
        <button class="new-button" type="button">タスク追加</button>
    </a>
    <div class="sortable-table">
        <table id="my-table1" class="table table-borderless table-hover">
            <thead>
            <tr>
                <th scope="col" style="width: 25%">ステータス</th>
                <th scope="col" style="width: 40%">内容</th>
                <th scope="col" data-id="limitDate" sortable style="width: 20%">期限</th>
                <th scope="col" style="width: 15%"></th>
            </tr>
            </thead>
            <tbody class="message-icon tasks" th:id="${list.index}" th:each="content, list : ${contents}">
            <tr>
                <td>
                    <form class="select_form" th:action="@{/statusUpdate}" th:method="post">
                        <select class="select_box" name="statusValue">
                            <option value="1" th:selected="${content.status == 1}">未実施</option>
                            <option value="2" th:selected="${content.status == 2}">実行中</option>
                            <option value="3" th:selected="${content.status == 3}">ステイ中</option>
                            <option value="4" th:selected="${content.status == 4}">完了</option>
                        </select>
                        <input name="id" th:value="${content.id}" type="hidden"/>
                        <input class="select_button" type="submit" style="visibility:hidden" value="変更" />
                    </form>
                    <script>
                        $('.select_box0').change(function() {
                            $('.select_button0').trigger('click');
                            $("#select_form0").submit();
                        });
                    </script>
                </td>
                <td class="text">
                    <pre><span th:text="${content.content}"/></pre>
                </td>
                <td>
                    <span class="strLimitDate" th:text="${content.limitDate}"/>
                </td>
                <td>
                    <div class="delete-button">
                        <form th:action="@{/delete/{id}(id=${content.id})}" th:method="delete" onclick="return confirm('本当に削除しますか?')">
                            <input type="submit" value="削除">
                        </form>
                    </div>
                    <div class="edit-button">
                        <a th:href="@{/edit/{id}(id=${content.id})}">
                            <input type="button" value="編集">
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
